<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 强制横屏和禁止缩放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>峡谷骑士大冒险</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #333;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* 禁止浏览器默认滑动 */
        }
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background-color: #c49a6c; /* 沙漠底色 */
        }
        
        /* UI 头部显示 */
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: 'Arial', sans-serif;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            font-size: 20px;
            pointer-events: none;
            z-index: 10;
        }
        #ui-layer div { margin-bottom: 10px; background: rgba(0,0,0,0.4); padding: 5px 15px; border-radius: 8px; }

        /* 摇杆容器 - 左下角 */
        #joystick-zone {
            position: absolute;
            bottom: 50px;
            left: 50px;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.4);
            z-index: 20;
            touch-action: none;
        }
        /* 摇杆推杆 */
        #joystick-thumb {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60px;
            height: 60px;
            margin-top: -30px; /* 居中 */
            margin-left: -30px; /* 居中 */
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            pointer-events: none;
            transition: none; /* 手感好，不要过渡动画 */
        }

        /* 技能按钮 - 右下角 */
        #skill-btn {
            position: absolute;
            bottom: 60px;
            right: 60px;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: rgba(255, 100, 100, 0.8);
            color: white;
            font-size: 24px;
            font-weight: bold;
            border: 4px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            touch-action: none;
            box-shadow: 0 0 20px rgba(255,0,0,0.3);
        }
        #skill-btn:active {
            transform: scale(0.9);
            background: rgba(255, 50, 50, 1);
        }
    </style>
</head>
<body>

    <!-- 游戏画布 -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI 层 -->
    <div id="ui-layer">
        <div>❤️ 血量: <span id="ui-hp">3</span></div>
        <div>⭐ 得分: <span id="ui-score">0</span></div>
    </div>

    <!-- 摇杆 -->
    <div id="joystick-zone">
        <div id="joystick-thumb"></div>
    </div>

    <!-- 技能按钮 -->
    <div id="skill-btn">⚔️攻击</div>

    <script>
        // ==========================================
        // 1. 初始化 Canvas 与 变量
        // ==========================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // 强制自适应屏幕分辨率
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 游戏数据
        let gameOver = false;
        let hp = 3;
        let score = 0;
        let broadcastQueue = [];
        
        // 玩家
        const player = { x: canvas.width/2, y: canvas.height/2, w: 30, h: 30, speed: 5 };
        // 摇杆输入向量 (-1 ~ 1)
        let joyX = 0, joyY = 0;
        
        // 敌人
        let enemies = [];
        let enemySpawnTimer = 0;
        
        // 攻击特效
        let attackActive = false;
        let attackDuration = 150; // 毫秒
        let attackTimer = 0;

        // ==========================================
        // 2. UI 更新与广播机制
        // ==========================================
        function updateUI() {
            document.getElementById('ui-hp').innerText = hp;
            document.getElementById('ui-score').innerText = score;
        }

        // 简易的消息系统（模仿 Scratch 的广播）
        function broadcast(msg) {
            broadcastQueue.push(msg);
        }
        
        function processBroadcasts() {
            while(broadcastQueue.length > 0) {
                let msg = broadcastQueue.shift();
                console.log("收到广播:", msg);
                
                // 处理各种广播
                if (msg === "死亡二") {
                    gameOver = true;
                    alert("勇敢的骑士倒下了！最终得分: " + score);
                    // 重置游戏
                    hp = 3;
                    score = 0;
                    enemies = [];
                    player.x = canvas.width / 2;
                    player.y = canvas.height / 2;
                    gameOver = false;
                    updateUI();
                } else if (msg === "消息二") {
                    // 图5逻辑：收到消息二，得分+1 (暂时不用，我们直接碰撞加分)
                }
            }
        }

        // ==========================================
        // 3. 摇杆控制逻辑 (支持触摸和鼠标)
        // ==========================================
        const joystickZone = document.getElementById('joystick-zone');
        const joystickThumb = document.getElementById('joystick-thumb');
        const joystickRadius = 70; // 摇杆最大移动半径 (140/2)
        
        function handleJoystick(e) {
            e.preventDefault();
            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const rect = joystickZone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            let deltaX = clientX - centerX;
            let deltaY = clientY - centerY;
            let distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

            // 限制摇杆在圆圈内
            if (distance > joystickRadius) {
                deltaX = (deltaX / distance) * joystickRadius;
                deltaY = (deltaY / distance) * joystickRadius;
                distance = joystickRadius;
            }

            // 移动摇杆 UI
            joystickThumb.style.transform = `translate(${deltaX}px, ${deltaY}px)`;

            // 计算输出向量 (-1 到 1)
            if (distance > 5) { // 死区阈值
                joyX = deltaX / joystickRadius;
                joyY = deltaY / joystickRadius;
            } else {
                joyX = 0;
                joyY = 0;
            }
        }

        function releaseJoystick(e) {
            e.preventDefault();
            joyX = 0; joyY = 0;
            joystickThumb.style.transform = `translate(0px, 0px)`;
        }

        // 监听事件
        joystickZone.addEventListener('touchstart', handleJoystick);
        window.addEventListener('touchmove', handleJoystick, {passive: false});
        window.addEventListener('touchend', releaseJoystick);
        // 兼容电脑鼠标调试
        joystickZone.addEventListener('mousedown', handleJoystick);
        window.addEventListener('mousemove', (e) => { if(e.buttons === 1) handleJoystick(e); });
        window.addEventListener('mouseup', releaseJoystick);

        // ==========================================
        // 4. 技能按钮逻辑
        // ==========================================
        const skillBtn = document.getElementById('skill-btn');
        
        skillBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            triggerAttack();
        });
        skillBtn.addEventListener('mousedown', (e) => {
            e.preventDefault();
            triggerAttack();
        });

        function triggerAttack() {
            if (gameOver) return;
            attackActive = true;
            attackTimer = Date.now();
            broadcast("消息一"); // 图4，收到消息一触发特效（这里简化为产生攻击判定）
            
            // 攻击判定：对摇杆方向或前方一定范围内的敌人造成伤害
            let attackRange = 70;
            let playerCenterX = player.x + player.w/2;
            let playerCenterY = player.y + player.h/2;

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                let enemyCenterX = e.x + e.w/2;
                let enemyCenterY = e.y + e.h/2;
                let dist = Math.hypot(enemyCenterX - playerCenterX, enemyCenterY - playerCenterY);
                
                if (dist < attackRange) {
                    // 消灭敌人
                    enemies.splice(i, 1);
                    score += 1;
                    broadcast("消息二"); // 触发分数广播
                }
            }
            updateUI();
        }

        // ==========================================
        // 5. 游戏循环 (更新与渲染)
        // ==========================================
        function spawnEnemy() {
            let side = Math.floor(Math.random() * 4);
            let x, y;
            let margin = 50;
            if (side === 0) { // 上
                x = Math.random() * canvas.width; y = -margin;
            } else if (side === 1) { // 下
                x = Math.random() * canvas.width; y = canvas.height + margin;
            } else if (side === 2) { // 左
                x = -margin; y = Math.random() * canvas.height;
            } else { // 右
                x = canvas.width + margin; y = Math.random() * canvas.height;
            }
            enemies.push({ 
                x: x, y: y, w: 30, h: 30, 
                speed: 1.2 + Math.random() * 0.5 
            });
        }

        function gameUpdate() {
            if (gameOver) return;

            // 1. 移动玩家
            if (joyX !== 0 || joyY !== 0) {
                player.x += joyX * player.speed;
                player.y += joyY * player.speed;
            }
            // 限制玩家地图边界
            player.x = Math.max(0, Math.min(player.x, canvas.width - player.w));
            player.y = Math.max(0, Math.min(player.y, canvas.height - player.h));

            // 2. 敌人 AI (向玩家移动)
            let playerCenterX = player.x + player.w/2;
            let playerCenterY = player.y + player.h/2;
            
            for (let e of enemies) {
                let dx = playerCenterX - (e.x + e.w/2);
                let dy = playerCenterY - (e.y + e.h/2);
                let dist = Math.hypot(dx, dy);
                if (dist > 0) {
                    e.x += (dx / dist) * e.speed;
                    e.y += (dy / dist) * e.speed;
                }
            }

            // 3. 碰撞检测 (玩家 vs 敌人)
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                if (player.x < e.x + e.w && player.x + player.w > e.x &&
                    player.y < e.y + e.h && player.y + player.h > e.y) {
                    // 扣血，移除敌人
                    hp -= 1;
                    enemies.splice(i, 1);
                    if (hp <= 0) {
                        hp = 0;
                        broadcast("死亡二");
                    }
                    updateUI();
                }
            }

            // 4. 处理碰撞广播
            processBroadcasts();

            // 5. 敌人生成
            enemySpawnTimer++;
            // 最多10个敌人，避免太多
            if (enemySpawnTimer % 45 === 0 && enemies.length < 8) {
                spawnEnemy();
            }

            // 6. 攻击特效消失
            if (attackActive && Date.now() - attackTimer > attackDuration) {
                attackActive = false;
            }
        }

        function gameRender() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 绘制沙漠地面
            ctx.fillStyle = '#c49a6c';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制敌人 (红色方块/圆形)
            ctx.fillStyle = '#ff3333';
            for (let e of enemies) {
                ctx.beginPath();
                ctx.arc(e.x + e.w/2, e.y + e.h/2, e.w/2, 0, Math.PI * 2);
                ctx.fill();
            }

            // 绘制玩家 (紫色骑士方块)
            ctx.fillStyle = '#8a2be2';
            ctx.fillRect(player.x, player.y, player.w, player.h);
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.strokeRect(player.x, player.y, player.w, player.h);

            // 绘制攻击特效
            if (attackActive) {
                ctx.fillStyle = 'rgba(255, 255, 0, 0.5)';
                ctx.beginPath();
                ctx.arc(player.x + player.w/2, player.y + player.h/2, 70, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function gameLoop() {
            gameUpdate();
            gameRender();
            requestAnimationFrame(gameLoop);
        }

        // ==========================================
        // 6. 启动游戏
        // ==========================================
        updateUI();
        gameLoop();
    </script>
</body>
</html>
