<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>骑士大冒险</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; 
            overflow: hidden; background-color: #000;
            user-select: none; -webkit-user-select: none; touch-action: none;
        }

        #gameCanvas { display: block; flex: 1; width: 100%; }

        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: flex; justify-content: center;
            align-items: center; z-index: 100; flex-direction: column;
        }
        #start-btn {
            width: 200px; height: 80px;
            background-image: url('https://i.ibb.co/R4jpTj3W/mmexport1787145375744.jpg');
            background-size: 100% 100%; background-color: transparent;
            border: none; outline: none; cursor: pointer; touch-action: manipulation;
        }
        #start-btn:active { transform: scale(0.9); }

        /* GAME OVER 弹层 */
        #game-over-screen {
            display: none; /* 初始隐藏 */
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); z-index: 150;
            flex-direction: column; align-items: center; justify-content: center;
        }
        #game-over-title {
            color: #ff3333; font-size: 60px; font-weight: 900; font-family: sans-serif;
            text-shadow: 3px 3px 6px #000;
            margin-bottom: 20px; letter-spacing: 5px;
        }
        #retry-btn {
            width: 160px; height: 60px; background: #4CAF50; color: white;
            border: 3px solid white; border-radius: 10px; font-size: 24px;
            font-weight: bold; cursor: pointer; touch-action: manipulation;
            margin-bottom: 20px;
        }
        #retry-btn:active { transform: scale(0.9); background: #45a049; }
        
        /* 广告容器 */
        #game-over-ad-container {
            width: 320px; height: 50px; 
            display: flex; justify-content: center; align-items: center;
            margin-top: 10px;
        }

        #ui-layer {
            position: absolute; top: 20px; left: 20px;
            color: white; font-family: sans-serif; font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            font-size: 22px; pointer-events: none; z-index: 10; line-height: 1.8;
        }
        #ui-layer div { background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 8px; margin-bottom: 5px; }

        #joystick-zone {
            position: absolute; bottom: 40px; left: 40px;
            width: 140px; height: 140px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255,255,255,0.4); z-index: 20; touch-action: none;
        }
        #joystick-thumb {
            position: absolute; top: 50%; left: 50%;
            width: 50px; height: 50px; margin-top: -25px; margin-left: -25px;
            border-radius: 50%; background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 10px rgba(0,0,0,0.5); pointer-events: none;
        }

        #skills-container {
            position: absolute; bottom: 40px; right: 40px;
            display: flex; gap: 20px; z-index: 20;
        }
        .skill-btn {
            width: 70px; height: 70px; border-radius: 50%; border: 3px solid #fff;
            background-size: cover; background-position: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); touch-action: manipulation;
        }
        .skill-btn:active { transform: scale(0.9); }
        #skill1 { background-image: url('https://i.ibb.co/YFqsbFZf/mmexport1786960537016-removebg-preview-edit-226118925829553.png'); }
        #skill2 { background-image: url('https://i.ibb.co/spwFzjDw/mmexport1786960530109-removebg-preview-edit-226194311249326.png'); }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="start-screen"><button id="start-btn"></button></div>

    <!-- GAME OVER 界面 -->
    <div id="game-over-screen" style="display: none;">
        <div id="game-over-title">GAME OVER</div>
        <button id="retry-btn">再来一局</button>
        
        <!-- 在按钮下方放置广告 -->
        <div id="game-over-ad-container">
            <script>
                atOptions = {
                    'key' : 'b28cf9191a966f9db38456003953420b',
                    'format' : 'iframe',
                    'height' : 50,
                    'width' : 320,
                    'params' : {}
                };
            </script>
            <script src="https://www.highrevenueformat.com/b28cf9191a966f9db38456003953420b/invoke.js"></script>
        </div>
    </div>

    <div id="ui-layer">
        <div>❤️ 血量: <span id="ui-hp">5</span></div>
        <div>⭐ 得分: <span id="ui-score">0</span></div>
    </div>

    <div id="joystick-zone"><div id="joystick-thumb"></div></div>

    <div id="skills-container">
        <div id="skill1" class="skill-btn"></div>
        <div id="skill2" class="skill-btn"></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { 
            canvas.width = canvas.parentElement.clientWidth; 
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const images = {
            bg: 'https://i.ibb.co/m5wzzRqw/mmexport1787145362768.jpg',
            knight: 'https://i.ibb.co/HDxjRFGS/mmexport1787146227623-removebg-preview.png',
            enemy: 'https://i.ibb.co/LdcsWRF6/Screenshot-20260819-212638-edit-35046427395164-removebg-preview.png',
            sword: 'https://i.ibb.co/5xrrKJMS/mmexport1787145389326-removebg-preview-edit-34506150608978.png'
        };

        function loadImages() {
            const promises = [];
            for (let [key, url] of Object.entries(images)) {
                const img = new Image(); img.crossOrigin = "Anonymous"; img.src = url;
                promises.push(new Promise(resolve => img.onload = () => resolve({key, img})));
            }
            return Promise.all(promises).then(results => {
                let loaded = {};
                results.forEach(r => loaded[r.key] = r.img);
                return loaded;
            });
        }

        let gameRunning = false, gameOver = false;
        let hp = 5, score = 0;
        let gameTime = 0;
        let joyX = 0, joyY = 0;
        let player = { x: canvas.width/2 - 35, y: canvas.height/2 - 35, w: 70, h: 70, speed: 5 };
        let enemies = [];
        let enemySpawnTimer = 0;
        let playerDirection = { x: 1, y: 0 };
        let flyingSword = null;
        let spinState = null;

        let spinDuration = 350;       
        const MAX_SPIN_DURATION = 1200;

        function updateUI() {
            document.getElementById('ui-hp').innerText = hp;
            document.getElementById('ui-score').innerText = score;
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('start-btn').addEventListener('touchstart', (e) => { e.preventDefault(); startGame(); });

        // 让“再来一局”按钮绑定重开逻辑
        const retryBtn = document.getElementById('retry-btn');
        retryBtn.addEventListener('click', retryGame);
        retryBtn.addEventListener('touchstart', (e) => { e.preventDefault(); retryGame(); });

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-over-screen').style.display = 'none';
            gameRunning = true; gameOver = false; 
            hp = 5; score = 0; gameTime = 0;
            enemies = [];
            player.x = canvas.width/2 - 35; player.y = canvas.height/2 - 35;
            flyingSword = null; spinState = null;
            spinDuration = 350;
            enemySpawnTimer = 0;
            updateUI();
        }

        // 重开函数
        function retryGame() {
            document.getElementById('game-over-screen').style.display = 'none';
            gameRunning = true; gameOver = false; 
            hp = 5; score = 0; gameTime = 0;
            enemies = [];
            player.x = canvas.width/2 - 35; player.y = canvas.height/2 - 35;
            flyingSword = null; spinState = null;
            spinDuration = 350;
            enemySpawnTimer = 0;
            updateUI();
        }

        const jZone = document.getElementById('joystick-zone');
        const jThumb = document.getElementById('joystick-thumb');
        const jRadius = 70;
        function handleJoy(e) {
            e.preventDefault();
            let clientX, clientY;
            if (e.touches) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; } 
            else { clientX = e.clientX; clientY = e.clientY; }
            const rect = jZone.getBoundingClientRect();
            const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
            let dx = clientX - cx, dy = clientY - cy;
            let dist = Math.hypot(dx, dy);
            if (dist > jRadius) { dx = (dx / dist) * jRadius; dy = (dy / dist) * jRadius; dist = jRadius; }
            jThumb.style.transform = `translate(${dx}px, ${dy}px)`;
            if (dist > 8) { joyX = dx / jRadius; joyY = dy / jRadius; } else { joyX = 0; joyY = 0; }
        }
        function releaseJoy(e) { e.preventDefault(); joyX = 0; joyY = 0; jThumb.style.transform = `translate(0px, 0px)`; }
        jZone.addEventListener('touchstart', handleJoy);
        window.addEventListener('touchmove', handleJoy, {passive: false});
        window.addEventListener('touchend', releaseJoy);
        jZone.addEventListener('mousedown', handleJoy);
        window.addEventListener('mousemove', (e) => { if(e.buttons === 1) handleJoy(e); });
        window.addEventListener('mouseup', releaseJoy);

        document.getElementById('skill1').addEventListener('touchstart', (e) => { e.preventDefault(); triggerSkill('thrust'); });
        document.getElementById('skill1').addEventListener('mousedown', (e) => { e.preventDefault(); triggerSkill('thrust'); });
        document.getElementById('skill2').addEventListener('touchstart', (e) => { e.preventDefault(); triggerSkill('spin'); });
        document.getElementById('skill2').addEventListener('mousedown', (e) => { e.preventDefault(); triggerSkill('spin'); });

        function triggerSkill(type) {
            if (!gameRunning || gameOver) return;
            if (type === 'thrust' && flyingSword) return;

            if (type === 'thrust') {
                let centerX = player.x + player.w / 2;
                let centerY = player.y + player.h / 2;
                
                let targetX = centerX + playerDirection.x * 300;
                let targetY = centerY + playerDirection.y * 300;
                let minDist = Infinity;

                for (let e of enemies) {
                    let eX = e.x + e.w/2, eY = e.y + e.h/2;
                    let dist = Math.hypot(eX - centerX, eY - centerY);
                    if (dist < minDist) { minDist = dist; targetX = eX; targetY = eY; }
                }

                let dx = targetX - centerX, dy = targetY - centerY;
                let dist = Math.hypot(dx, dy);
                let speed = 12;
                if (dist < 1) { dx = playerDirection.x; dy = playerDirection.y; }

                flyingSword = {
                    x: centerX, y: centerY,
                    vx: (dx / dist) * speed, vy: (dy / dist) * speed,
                    returning: false, speed: speed
                };
            } else if (type === 'spin') {
                spinDuration += 80;
                if (spinDuration > MAX_SPIN_DURATION) {
                    spinDuration = MAX_SPIN_DURATION;
                }
                spinState = { startTime: Date.now(), duration: spinDuration };
            }
        }

        let imgAssets = null;
        loadImages().then(loaded => { imgAssets = loaded; gameLoop(); });

        function gameUpdate() {
            if (!gameRunning || gameOver || !imgAssets) return;

            if (joyX !== 0 || joyY !== 0) {
                player.x += joyX * player.speed; player.y += joyY * player.speed;
                if (Math.abs(joyX) > Math.abs(joyY)) playerDirection.x = joyX > 0 ? 1 : -1;
                else playerDirection.y = joyY > 0 ? 1 : -1;
            }
            player.x = Math.max(0, Math.min(player.x, canvas.width - player.w));
            player.y = Math.max(0, Math.min(player.y, canvas.height - player.h));

            if (flyingSword) {
                flyingSword.x += flyingSword.vx;
                flyingSword.y += flyingSword.vy;
                let fsx = flyingSword.x - 45, fsy = flyingSword.y - 25, fsw = 90, fsh = 60;
                for (let i = enemies.length - 1; i >= 0; i--) {
                    let e = enemies[i];
                    if (fsx < e.x + e.w && fsx + fsw > e.x && fsy < e.y + e.h && fsy + fsh > e.y) {
                        enemies.splice(i, 1); score++; updateUI();
                    }
                }
                if (!flyingSword.returning) {
                    if (flyingSword.x < -50 || flyingSword.x > canvas.width + 50 || 
                        flyingSword.y < -50 || flyingSword.y > canvas.height + 50) {
                        flyingSword.returning = true;
                    }
                }
                if (flyingSword.returning) {
                    let pcx = player.x + player.w/2, pcy = player.y + player.h/2;
                    let dx = pcx - flyingSword.x, dy = pcy - flyingSword.y;
                    let dist = Math.hypot(dx, dy);
                    if (dist < 20) { flyingSword = null; }
                    else {
                        flyingSword.vx = (dx / dist) * flyingSword.speed;
                        flyingSword.vy = (dy / dist) * flyingSword.speed;
                    }
                }
            }

            if (spinState) {
                let pX = player.x + player.w/2, pY = player.y + player.h/2;
                let progress = (Date.now() - spinState.startTime) / spinState.duration;
                if (progress >= 1) { spinState = null; }
                else {
                    let angle = progress * 4 * Math.PI;
                    for (let i = enemies.length - 1; i >= 0; i--) {
                        let e = enemies[i];
                        let eX = e.x + e.w/2, eY = e.y + e.h/2;
                        let dx = eX - pX, dy = eY - pY;
                        let localX = dx * Math.cos(-angle) - dy * Math.sin(-angle);
                        let localY = dx * Math.sin(-angle) + dy * Math.cos(-angle);
                        if (localX > 20 && localX < 160 && Math.abs(localY) < 35) {
                            enemies.splice(i, 1);
                            score++;
                            updateUI();
                        }
                    }
                }
            }

            gameTime++;
            let currentSpeed = 0.75 + Math.floor(score / 25) * 0.3 + Math.floor(gameTime / 2700) * 0.3;

            let maxEnemies = 10 + Math.floor(score / 30) * 1 + Math.floor(gameTime / 1800) * 1;
            let spawnRate = 30 - Math.floor(score / 30) * 1 - Math.floor(gameTime / 1800) * 1;
            if (spawnRate < 2) spawnRate = 2;

            enemySpawnTimer++;
            if (enemySpawnTimer % spawnRate === 0 && enemies.length < maxEnemies) {
                let side = Math.floor(Math.random() * 4), margin = 40;
                let x=0, y=0;
                if (side === 0) { x = Math.random() * canvas.width; y = -margin; }
                else if (side === 1) { x = Math.random() * canvas.width; y = canvas.height + margin; }
                else if (side === 2) { x = -margin; y = Math.random() * canvas.height; }
                else { x = canvas.width + margin; y = Math.random() * canvas.height; }
                enemies.push({ x, y, w: 50, h: 50, speed: currentSpeed });
            }

            for (let e of enemies) {
                let dx = player.x + player.w/2 - (e.x + e.w/2), dy = player.y + player.h/2 - (e.y + e.h/2);
                let dist = Math.hypot(dx, dy);
                if (dist > 0) { e.x += (dx/dist) * e.speed; e.y += (dy/dist) * e.speed; }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                if (player.x < e.x + e.w && player.x + player.w > e.x && player.y < e.y + e.h && player.y + player.h > e.y) {
                    hp -= 1; enemies.splice(i, 1); updateUI();
                    if (hp <= 0) {
                        hp = 0;
                        gameOver = true; 
                        updateUI();

                        // 移除 alert，改为显示 GAME OVER 界面（用来放广告和重开按钮）
                        document.getElementById('game-over-screen').style.display = 'flex';
                        // 直接让游戏循环停止或冻结，靠 gameOver=true 来阻止后续更新
                        return; // 跳出更新，直接进入渲染
                    }
                }
            }
        }

        function gameRender() {
            if (!imgAssets) return;
            ctx.drawImage(imgAssets.bg, 0, 0, canvas.width, canvas.height);

            for (let e of enemies) { ctx.drawImage(imgAssets.enemy, e.x, e.y, e.w, e.h); }

            let pX = player.x + player.w/2, pY = player.y + player.h/2;
            ctx.save();
            let scaleX = playerDirection.x >= 0 ? 1 : -1;
            ctx.translate(pX, pY); ctx.scale(scaleX, 1);
            ctx.drawImage(imgAssets.knight, -player.w/2, -player.h/2, player.w, player.h);
            ctx.restore();

            const swordLen = 160, swordHeight = 80;

            if (spinState) {
                let progress = (Date.now() - spinState.startTime) / spinState.duration;
                let angle = progress * 4 * Math.PI;
                ctx.save();
                ctx.translate(pX, pY);
                ctx.rotate(angle);
                ctx.drawImage(imgAssets.sword, -swordLen/2, -swordHeight/2, swordLen, swordHeight);
                ctx.restore();
            } else if (flyingSword) {
                ctx.save();
                ctx.translate(flyingSword.x, flyingSword.y);
                ctx.rotate(Math.atan2(flyingSword.vy, flyingSword.vx));
                ctx.drawImage(imgAssets.sword, -swordLen/2, -swordHeight/2, swordLen, swordHeight);
                ctx.restore();
            } else {
                ctx.save();
                ctx.translate(pX, pY);
                ctx.rotate(Math.atan2(playerDirection.y, playerDirection.x));
                ctx.translate(30, 0);
                ctx.drawImage(imgAssets.sword, -swordLen/2, -swordHeight/2, swordLen, swordHeight);
                ctx.restore();
            }
        }

        function gameLoop() { gameUpdate(); gameRender(); requestAnimationFrame(gameLoop); }
    </script>
</body>
</html>
