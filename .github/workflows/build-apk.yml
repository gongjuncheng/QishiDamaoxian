name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20   # ⚠️ 原版用 18；若 npm install -g cordova 拉到 Cordova 14，会要求 Node 20+ 直接报错

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'  # AGP 必须用 Java 17

      # ✅ 关键修复①：runner 全局是 Gradle 9.7.0，Cordova 12 的 wrapper 生成步骤用它跑会卡 XmlParser。
      # 锁到 8.x 让该步骤用 8.0.1（实际编译走 Cordova 生成的 7.6 wrapper，两者都带 groovy-xml）。
      - name: Setup Gradle 8.x (override runner's Gradle 9)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0.1'

      - name: Install Cordova (pin 版本，避免拉到不兼容的新版)
        run: npm install -g cordova@12

      # ✅ 关键修复②：runner 的 sdkmanager 不在 PATH，且缺 build-tools;33.0.2。
      # 用官方 action 装好 cmdline-tools + sdkmanager 并接受许可，再把缺失的构建工具装上。
      - name: Setup Android SDK (cmdline-tools + licenses)
        uses: android-actions/setup-android@v3

      - name: Install required build tools & platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-33" "build-tools;33.0.2"

      - name: Create Cordova project
        run: |
          cordova create app com.qishi.knightadventure KnightAdventure
          rm -rf app/www/*
          cp -r HTML/* app/www/
          cp config.xml app/

      - name: Add Android platform
        working-directory: app
        run: cordova platform add android@12.0.0

      - name: Build APK (debug)
        working-directory: app
        run: cordova build android --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: knight-adventure-apk
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
