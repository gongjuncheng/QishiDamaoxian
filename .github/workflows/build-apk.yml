name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20   # ⚠️ 原版用 18；若 npm install -g cordova 拉到 Cordova 14，会要求 Node 20+ 直接报错

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'  # AGP 8.0 必须用 Java 17

      - name: Install Cordova (pin 版本，避免拉到不兼容的新版)
        run: npm install -g cordova@12

      - name: Accept Android SDK licenses & 确保编译依赖存在
        run: |
          # ubuntu-latest runner 已预装 Android SDK，但显式接受许可 + 确认平台/构建工具在位更稳
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-33" "build-tools;33.0.1"

      - name: Create Cordova project
        run: |
          cordova create app com.qishi.knightadventure KnightAdventure
          rm -rf app/www/*
          cp -r HTML/* app/www/
          cp config.xml app/

      - name: Add Android platform
        working-directory: app
        run: cordova platform add android@12.0.0

      - name: Build APK (debug)
        working-directory: app
        run: cordova build android --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: knight-adventure-apk
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
