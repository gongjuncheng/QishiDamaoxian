name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20   # ⚠️ 原版用 18；若 npm install -g cordova 拉到 Cordova 14，会要求 Node 20+ 直接报错

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'  # AGP 8.0 必须用 Java 17

      - name: Install Cordova (pin 版本，避免拉到不兼容的新版)
        run: npm install -g cordova@12

      - name: Ensure Android SDK env (sdkmanager 不在 PATH，无需调用；仅确认 ANDROID_HOME 就位)
        run: |
          if [ -d "/usr/local/lib/android/sdk" ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          else
            echo "Android SDK not found at default path" && exit 1
          fi

      - name: Create Cordova project
        run: |
          cordova create app com.qishi.knightadventure KnightAdventure
          rm -rf app/www/*
          cp -r HTML/* app/www/
          cp config.xml app/

      - name: Add Android platform
        working-directory: app
        run: cordova platform add android@12.0.0

      - name: Build APK (debug)
        working-directory: app
        run: cordova build android --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: knight-adventure-apk
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
