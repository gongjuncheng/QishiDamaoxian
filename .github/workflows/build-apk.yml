name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # ✅ 强制使用 Gradle 8.9（关键修复）
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova project
        run: |
          cordova create app com.qishi.knightadventure KnightAdventure
          rm -rf app/www/*
          cp -r HTML/* app/www/
          cp config.xml app/

      - name: Add Android platform
        working-directory: app
        run: |
          cordova platform add android@12.0.0
          cordova plugin add cordova-plugin-whitelist

      - name: Build APK (debug)
        working-directory: app
        run: cordova build android --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: knight-adventure-apk
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
