name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova project
        run: |
          cordova create app com.qishi.knightadventure KnightAdventure
          # ✅ 把 HTML 目录内容直接拷贝到 www 根目录
          cp -r HTML/* app/www/
          cp config.xml app/

      - name: Add Android platform and plugins
        working-directory: app
        run: |
          cordova platform add android
          cordova plugin add cordova-plugin-whitelist

      - name: Build APK (debug)
        working-directory: app
        run: cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: knight-adventure-apk
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
